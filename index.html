<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AI Chat — powered by Qwen3 via Ollama" />
    <meta name="theme-color" content="#0d0d0d" />
    <title>AI Chat</title>
    <!-- Apply saved theme before React loads to prevent flash -->
    <script>
      ;(function () {
        var t = localStorage.getItem('ai-chat-theme')
        var theme = t === 'light' || t === 'dark' ? t : 'dark'
        document.documentElement.classList.remove('dark', 'light')
        document.documentElement.classList.add(theme)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-surface-0 text-text-primary antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
